[package]
name = "jellyfish-net"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = {version = "0.52.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Gdi"]}
window-enumerator = { version = "0.4"}
rdev  = "0.5"
once_cell = "1.21.3"
tray-icon = "0.21.2"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.36.1"
env_logger = "0.11.11"
log = "0.4.34"
